services:
  postgres:
    image: postgres:16-alpine
    container_name: assets-postgres
    environment:
      POSTGRES_DB: assetsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - assets_postgres_data:/var/lib/postgresql/data
    networks:
      - assets-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assetsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  assetsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assets-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assetsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080

      ASSETS_BASE_PATH: /app/assets

      ASSETS_PUBLIC_BASE_URL: http://localhost:8081/assets

    ports:
      - "8080:8080"

    volumes:
      - ./assets:/app/assets

    networks:
      - assets-network

  nginx:
    image: nginx:alpine
    container_name: assets-nginx
    depends_on:
      - assetsapp
    ports:
      - "8081:80"

    volumes:

      - ./assets:/usr/share/nginx/assets:ro

      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - assets-network

volumes:
  assets_postgres_data:

networks:
  assets-network:
    driver: bridge