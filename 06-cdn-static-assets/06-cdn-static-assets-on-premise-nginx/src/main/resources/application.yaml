spring:
  application:
    name: cdn-static-nginx

  datasource:
    url: jdbc:postgresql://localhost:5432/assetsdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8080


