spring:
  application:
    name: cdn-static-nginx

  datasource:
    url: jdbc:postgresql://localhost:5432/assetsdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8080

assets:
  base-path: ${ASSETS_BASE_PATH:./assets}
  public-base-url: ${ASSETS_PUBLIC_BASE_URL:http://localhost:8081/assets}


