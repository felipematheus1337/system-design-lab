spring:
  application:
    name: delivery-api

  datasource:
    primary:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:app_db}
      username: ${POSTGRES_USER:app_user}
      password: ${POSTGRES_PASSWORD:app_password}
      driver-class-name: org.postgresql.Driver
    replica-1:
        jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:app_db}
        username: ${POSTGRES_USER:app_user}
        password: ${POSTGRES_PASSWORD:app_password}
        driver-class-name: org.postgresql.Driver
    replica-2:
        jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:app_db}
        username: ${POSTGRES_USER:app_user}
        password: ${POSTGRES_PASSWORD:app_password}
        driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}