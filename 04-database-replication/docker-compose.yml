services:
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - dbnet

  app1:
    image: delivery-api:latest
    container_name: delivery-app-1
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - dbnet

  app2:
    image: delivery-api:latest
    container_name: delivery-app-2
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - dbnet


  postgres-primary:
    image: bitnami/postgresql:15
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator# usuário só p/ replicação
      POSTGRESQL_REPLICATION_PASSWORD: reppass
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/bitnami/postgresql
    networks:
      - dbnet


  postgres-replica-1:
      image: bitnami/postgresql:15
      environment:
        POSTGRESQL_USERNAME: ${POSTGRES_USER}
        POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRESQL_REPLICATION_MODE: slave
        POSTGRESQL_MASTER_HOST: postgres-primary
        POSTGRESQL_MASTER_PORT_NUMBER: 5432
        POSTGRESQL_REPLICATION_USER: replicator
        POSTGRESQL_REPLICATION_PASSWORD: reppass
      ports:
        - "5433:5432"
      depends_on:
        - postgres-primary
      networks:
        - dbnet

  postgres-replica-2:
      image: bitnami/postgresql:15
      environment:
        POSTGRESQL_USERNAME: ${POSTGRES_USER}
        POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRESQL_REPLICATION_MODE: slave
        POSTGRESQL_MASTER_HOST: postgres-primary
        POSTGRESQL_MASTER_PORT_NUMBER: 5432
        POSTGRESQL_REPLICATION_USER: replicator
        POSTGRESQL_REPLICATION_PASSWORD: reppass
      ports:
        - "5434:5432"
      depends_on:
        - postgres-primary
      networks:
        - dbnet

volumes:
  pg_primary_data:

networks:
  dbnet:
    driver: bridge